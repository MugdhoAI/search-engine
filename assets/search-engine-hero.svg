  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" opacity="1" transform="translate(0 0)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.56;0.93;0.99;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0;0 8;0 8" keyTimes="0;0.50;0.56;0.93;0.99;1" dur="12s" repeatCount="indefinite"/>
    <text x="724" y="252" fill="#9ADCF5">0.251804</text>
    <text x="828" y="252" fill="#E6F0F8">1</text>
    <text x="862" y="252" fill="#E6F0F8">Python is a programming language designed for readable software.</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" opacity="1" transform="translate(0 0)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.64;0.93;0.99;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 8;0 8;0 0;0 0;0 8;0 8" keyTimes="0;0.58;0.64;0.93;0.99;1" dur="12s" repeatCount="indefinite"/>
    <text x="724" y="298" fill="#9ADCF5">0.251804</text>
    <text x="828" y="298" fill="#E6F0F8">4</text>
    <text x="862" y="298" fill="#E6F0F8">Python can be used to build search systems.</text>
  </g>
  <!-- Scan highlight: one quiet pass over the results -->
  <rect x="724" y="230" width="780" height="48" rx="6" fill="#58D5F7" opacity="0" transform="translate(0 0)">
    <animate attributeName="opacity" values="0;0;0.09;0.09;0;0" keyTimes="0;0.68;0.71;0.78;0.81;1" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 48;0 48;0 48" keyTimes="0;0.68;0.80;0.81;1" dur="12s" repeatCount="indefinite"/>
  </rect>


  <!-- Terminal footer: the detail hidden in the numbers -->
  <path d="M724 356H1504" stroke="#162636"/>
  <text x="724" y="386" fill="#5C7186" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13.5">TF-IDF ranking · 4 documents indexed · scores, doc IDs, text</text>

  <!-- Caption under terminal -->
  <text x="1536" y="456" fill="#5C7186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" text-anchor="end">Equal scores? Ordered by ascending document ID — always.</text>
