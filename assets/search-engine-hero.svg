  <text x="64" y="132" fill="#58D5F7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="19" font-weight="600" letter-spacing="2">MUGDHOAI  /  SEARCH-ENGINE</text>
  <text x="60" y="216" fill="#F5F8FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="750" letter-spacing="-2">Search Engine</text>
  <text x="64" y="264" fill="#D5DFEA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">From raw text to ranked results.</text>
  <text x="64" y="296" fill="#7E97AE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5">Inverted index · Boolean &amp; phrase queries · JSON persistence</text>

