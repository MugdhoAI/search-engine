    <text x="748" y="192" fill="#E6F0F8" clip-path="url(#qclip)">search-engine examples/documents.json <tspan fill="#9ADCF5">"python AND search"</tspan></text>
    <rect x="1147" y="176" width="9" height="20" rx="1" fill="#58D5F7" transform="translate(199.5 0)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;10.5 0;21 0;31.5 0;42 0;52.5 0;63 0;73.5 0;84 0;94.5 0;105 0;115.5 0;126 0;136.5 0;147 0;157.5 0;168 0;178.5 0;189 0;199.5 0;199.5 0" keyTimes="0;0.08;0.0979;0.1158;0.1337;0.1516;0.1695;0.1874;0.2053;0.2232;0.2411;0.2589;0.2768;0.2947;0.3126;0.3305;0.3484;0.3663;0.3842;0.4021;0.42;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1;1;0;1;0;1;1" keyTimes="0;0.03;0.06;0.08;0.50;0.56;0.62;0.68;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
