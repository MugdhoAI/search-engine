<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" fill="none">
  <defs>
    <linearGradient id="bg2i" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070D16"/><stop offset="1" stop-color="#0A141F"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="520" rx="20" fill="url(#bg2i)"/>
  <rect x="1" y="1" width="1598" height="518" rx="19" stroke="#22364A" stroke-opacity=".8"/>

  <!-- Left: identity -->
  <text x="64" y="132" fill="#58D5F7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="19" font-weight="600" letter-spacing="2">MUGDHOAI  /  SEARCH-ENGINE</text>
  <text x="60" y="216" fill="#F5F8FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="750" letter-spacing="-2">Search Engine</text>
  <text x="64" y="264" fill="#D5DFEA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">From raw text to ranked results.</text>
  <text x="64" y="296" fill="#7E97AE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16.5">Inverted index · Boolean &amp; phrase queries · JSON persistence</text>

  <!-- Pills -->
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#5ED3F3">
    <rect x="64" y="322" width="188" height="42" rx="9" fill="none" stroke="#2E7C96" stroke-width="1.4"/>
    <text x="82" y="349">Python 3.11–3.14</text>
    <rect x="268" y="322" width="142" height="42" rx="9" fill="none" stroke="#2E7C96" stroke-width="1.4"/>
    <text x="286" y="349">MIT License</text>
    <rect x="426" y="322" width="92" height="42" rx="9" fill="none" stroke="#2E7C96" stroke-width="1.4"/>
    <text x="444" y="349">v0.1.0</text>
  </g>

  <!-- Left footer -->
  <text x="64" y="456" fill="#58B7D6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15.5" letter-spacing="2.5">TOKENIZE  ·  INDEX  ·  QUERY  ·  RANK</text>

  <!-- Right: terminal -->
  <rect x="692" y="86" width="844" height="330" rx="16" fill="#04070C"/>
  <rect x="692" y="86" width="844" height="330" rx="16" stroke="#2A3E55" stroke-width="1.5"/>
  <path d="M692 140H1536" stroke="#1E2E42"/>
  <g>
    <circle cx="724" cy="113" r="7" fill="#58D5F7"/>
    <circle cx="750" cy="113" r="7" fill="#58D5F7" fill-opacity=".65"/>
    <circle cx="776" cy="113" r="7" fill="#58D5F7" fill-opacity=".35"/>
  </g>
  <text x="1114" y="118" fill="#5C7186" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" text-anchor="middle">zsh — search-engine</text>

  <!-- Command, with block cursor -->
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17.5">
    <text x="724" y="192" fill="#58D5F7" font-weight="700">$</text>
    <text x="748" y="192" fill="#E6F0F8">search-engine examples/documents.json <tspan fill="#9ADCF5">"python AND search"</tspan><tspan fill="#58D5F7"> ▌</tspan></text>
  </g>

  <!-- Results: full, untruncated real output, aligned columns -->
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
    <text x="724" y="252" fill="#9ADCF5">0.251804</text>
    <text x="828" y="252" fill="#E6F0F8">1</text>
    <text x="862" y="252" fill="#E6F0F8">Python is a programming language designed for readable software.</text>
    <text x="724" y="298" fill="#9ADCF5">0.251804</text>
    <text x="828" y="298" fill="#E6F0F8">4</text>
    <text x="862" y="298" fill="#E6F0F8">Python can be used to build search systems.</text>
  </g>

  <!-- Terminal footer: the detail hidden in the numbers -->
  <path d="M724 356H1504" stroke="#162636"/>
  <text x="724" y="386" fill="#5C7186" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13.5">TF-IDF ranking · 4 documents indexed · scores, doc IDs, text</text>

  <!-- Caption under terminal -->
  <text x="1536" y="456" fill="#5C7186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.5" text-anchor="end">Equal scores? Ordered by ascending document ID — always.</text>
</svg>
